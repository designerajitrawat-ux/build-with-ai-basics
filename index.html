<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Make It Pop: decode vague client feedback</title>
  <meta name="description" content="Paste your client's messy feedback. Get a clear to-do list, plus the questions to ask about the vague bits.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page">
    <header class="masthead">
      <h1 class="wordmark">Make it pop</h1>
      <p class="promise">Paste your client's feedback. Get a clear to-do list, plus the questions to ask about the vague bits.</p>
    </header>

    <section class="input-card" aria-label="Client feedback">
      <label class="input-label" for="feedback">Client feedback</label>
      <textarea id="feedback" rows="9" placeholder="Paste the client's message here. WhatsApp, email, anything."></textarea>
      <div class="input-actions">
        <div class="samples">
          <button type="button" class="btn btn-ghost" data-sample="en">Try an English sample</button>
          <button type="button" class="btn btn-ghost" data-sample="hi">Try a Hinglish sample</button>
        </div>
        <button type="button" id="decode" class="btn btn-primary" disabled>Decode</button>
      </div>
    </section>

    <section id="results" class="results" hidden aria-live="polite">
      <p id="summary" class="summary"></p>
      <div id="lists" class="lists">
        <section class="list list-ask" aria-labelledby="ask-title">
          <header class="list-head">
            <h2 id="ask-title">Ask the client <span id="ask-count" class="count"></span></h2>
          </header>
          <ol id="ask-list" class="items"></ol>
          <p id="ask-empty" class="empty" hidden>Nothing vague here. Your client was clear this time.</p>
        </section>
        <section class="list list-ready" aria-labelledby="ready-title">
          <header class="list-head">
            <h2 id="ready-title">Ready to do <span id="ready-count" class="count"></span></h2>
          </header>
          <ul id="ready-list" class="items"></ul>
          <p id="ready-empty" class="empty" hidden>Nothing to start yet. Send the questions first.</p>
        </section>
      </div>
    </section>
  </main>

  <script src="js/phrases.js"></script>
  <script src="js/decoder.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
